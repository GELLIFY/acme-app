name: Cleanup Preview

# The configuration of the deployment target. Every action under `cd/` reads it from here rather
# than taking it as inputs, which is what keeps the jobs below free of provider-specific wiring:
# only these lines and the `cd/<target>/` paths name a provider.
#
# #if isTemplate
# The steps below are not duplicated per target, and must not be: two `#if`-marked copies of a step
# would both be live in this repository, running two deployments and colliding on their step id.
# This repository deploys to Vercel, full stop; scaffolding for AWS rewrites the `cd/vercel/` paths
# to `cd/aws/` and drops the block below that does not apply.
# #endif
env:
  # #if deployVercel
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
  # #endif
  # #if deployAws
  AWS_REGION: eu-central-1
  AWS_ROLE: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/gh-actions-preview
  BASE_ENV: test
  # #endif

on:
  pull_request:
    types:
      - closed

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  # The deployment goes first: whatever it runs holds an open connection to the database branch, so
  # deleting the branch out from under a still-running task would only produce a noisy crash loop
  # until the teardown catches up.
  cleanup_preview:
    if: ${{ !startsWith(github.head_ref, 'renovate/') }}
    name: Cleanup Preview
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      # Required by the OIDC login the AWS deployment target uses; harmless otherwise.
      id-token: write
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Install dependencies & tooling
        uses: ./.github/workflows/setup

      - name: Get branch name
        id: branch_name
        uses: tj-actions/branch-names@dde14ac574a8b9b1cedc59a1cf312788af43d8d8 # v8

      - name: Cleanup Preview Deployment
        uses: ./.github/workflows/cd/vercel/cleanup-preview
        with:
          PR_NUMBER: ${{ github.event.number }}
          GIT_BRANCH: ${{ steps.branch_name.outputs.current_branch }}

  # #if useNeon
  delete_neon_branch:
    if: ${{ !startsWith(github.head_ref, 'renovate/') }}
    name: Delete Neon Branch
    needs: cleanup_preview
    runs-on: ubuntu-latest
    steps:
      - name: Get branch name
        id: branch_name
        uses: tj-actions/branch-names@dde14ac574a8b9b1cedc59a1cf312788af43d8d8 # v8

      - name: Delete Neon Branch
        continue-on-error: true
        uses: neondatabase/delete-branch-action@4468d825d5a88ef4012f1705a82f02ec3072f776 # v3
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          branch: preview/pr-${{ github.event.number }}-${{ steps.branch_name.outputs.current_branch }}
          api_key: ${{ secrets.NEON_API_KEY }}
  # #endif
