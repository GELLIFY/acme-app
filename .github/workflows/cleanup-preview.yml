name: Cleanup Preview

# The configuration of the deployment target. Every action under `cd/` reads it from here rather
# than taking it as inputs, which is what keeps the jobs below free of provider-specific wiring:
# only the `uses:` paths and these lines name a provider.
#
# #if isTemplate
# One block with both providers' variables, rather than one block each: two top-level `env:` keys
# would be a duplicate mapping key, and the template has to stay valid YAML with every marker
# still in place.
# #endif
env:
  # #if deployVercel
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
  # #endif
  # #if deployAws
  AWS_REGION: eu-central-1
  AWS_ROLE: arn:aws:iam::988267347351:role/Pipeline
  # The repository holding the Pulumi program, checked out by the actions that need it.
  INFRA_REPO: GELLIFY/acme-app-aws
  INFRA_SSH_KEY: ${{ secrets.INFRA_ACTION_SSH_KEY }}
  # The environment previews are previews *of*, and whose registry and secrets they reuse.
  BASE_ENV: test
  PRODUCTION_ENV: prod
  PULUMI_BACKEND_URL: s3://acme-app-aws-pulumi-state
  PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PULUMI_CONFIG_PASSPHRASE }}
  # #endif

on:
  pull_request:
    types:
      - closed

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  delete_neon_branch:
    if: ${{ !startsWith(github.head_ref, 'renovate/') }}
    name: Delete Neon Branch
    runs-on: ubuntu-latest
    steps:
      - name: Get branch name
        id: branch_name
        uses: tj-actions/branch-names@dde14ac574a8b9b1cedc59a1cf312788af43d8d8 # v8

      - name: Delete Neon Branch
        continue-on-error: true
        uses: neondatabase/delete-branch-action@4468d825d5a88ef4012f1705a82f02ec3072f776 # v3
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          branch: preview/pr-${{ github.event.number }}-${{ steps.branch_name.outputs.current_branch }}
          api_key: ${{ secrets.NEON_API_KEY }}

  cleanup_preview:
    if: ${{ !startsWith(github.head_ref, 'renovate/') }}
    name: Cleanup Preview
    needs: delete_neon_branch
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      # Required by the OIDC login the AWS deployment target uses; harmless otherwise.
      id-token: write
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Install dependencies & tooling
        uses: ./.github/workflows/setup

      - name: Get branch name
        id: branch_name
        uses: tj-actions/branch-names@dde14ac574a8b9b1cedc59a1cf312788af43d8d8 # v8

      # #if deployVercel
      - name: Cleanup Preview Deployment
        uses: ./.github/workflows/cd/vercel/cleanup-preview
        with:
          PR_NUMBER: ${{ github.event.number }}
          GIT_BRANCH: ${{ steps.branch_name.outputs.current_branch }}
      # #endif
      # #if deployAws
      - name: Cleanup Preview Deployment
        uses: ./.github/workflows/cd/aws/cleanup-preview
        with:
          PR_NUMBER: ${{ github.event.number }}
          GIT_BRANCH: ${{ steps.branch_name.outputs.current_branch }}
      # #endif
