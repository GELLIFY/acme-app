name: Deploy Production

# The configuration of the deployment target. Every action under `cd/` reads it from here rather
# than taking it as inputs, which is what keeps the jobs below free of provider-specific wiring:
# only these lines and the `cd/<target>/` paths name a provider.
#
env:
  AWS_REGION: eu-central-1
  AWS_ROLE: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/Pipeline
  # The repository holding the Pulumi program, checked out by the actions that need it.
  INFRA_REPO: GELLIFY/acme-app-aws
  INFRA_SSH_KEY: ${{ secrets.INFRA_ACTION_SSH_KEY }}
  # The environment previews are previews *of*, and whose registry and secrets they reuse.
  BASE_ENV: test
  PRODUCTION_ENV: prod
  PULUMI_BACKEND_URL: s3://acme-app-aws-pulumi-state
  PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PULUMI_CONFIG_PASSPHRASE }}

on:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  code_quality:
    name: Code quality
    uses: ./.github/workflows/ci.yml

  run_migrations:
    name: Run Migrations
    runs-on: ubuntu-24.04-arm
    needs: [code_quality]
    permissions:
      contents: read
      pull-requests: write
      # Required by the OIDC login the AWS deployment target uses; harmless otherwise.
      id-token: write
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Install dependencies & tooling
        uses: ./.github/workflows/setup

      - name: Read the production environment
        uses: ./.github/workflows/cd/aws/production-env

      - name: Apply Migrations
        run: |
          echo SKIP_ENV_VALIDATION=1 >> .env
          pnpm run db:migrate

  deploy_production:
    name: Deploy Production
    runs-on: ubuntu-24.04-arm
    environment: production
    needs: [code_quality, run_migrations]
    permissions:
      contents: read
      pull-requests: write
      # Required by the OIDC login the AWS deployment target uses; harmless otherwise.
      id-token: write
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Install dependencies & tooling
        uses: ./.github/workflows/setup

      - name: Deploy to Production
        uses: ./.github/workflows/cd/aws/deploy-production
