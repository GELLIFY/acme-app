name: Deploy Production

# The configuration of the deployment target. Every action under `cd/` reads it from here rather
# than taking it as inputs, which is what keeps the jobs below free of provider-specific wiring:
# only the `uses:` paths and these lines name a provider.
#
# #if isTemplate
# One block with both providers' variables, rather than one block each: two top-level `env:` keys
# would be a duplicate mapping key, and the template has to stay valid YAML with every marker
# still in place.
# #endif
env:
  # #if deployVercel
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
  # #endif
  # #if deployAws
  AWS_REGION: eu-central-1
  AWS_ROLE: arn:aws:iam::988267347351:role/Pipeline
  # The repository holding the Pulumi program, checked out by the actions that need it.
  INFRA_REPO: GELLIFY/acme-app-aws
  INFRA_SSH_KEY: ${{ secrets.INFRA_ACTION_SSH_KEY }}
  # The environment previews are previews *of*, and whose registry and secrets they reuse.
  BASE_ENV: test
  PRODUCTION_ENV: prod
  PULUMI_BACKEND_URL: s3://acme-app-aws-pulumi-state
  PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PULUMI_CONFIG_PASSPHRASE }}
  # #endif

on:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  code_quality:
    name: Code quality
    uses: ./.github/workflows/ci.yml

  run_migrations:
    name: Run Migrations
    runs-on: ubuntu-24.04-arm
    needs: [code_quality]
    permissions:
      contents: read
      pull-requests: write
      # Required by the OIDC login the AWS deployment target uses; harmless otherwise.
      id-token: write
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Install dependencies & tooling
        uses: ./.github/workflows/setup

      # #if deployVercel
      - name: Read the production environment
        uses: ./.github/workflows/cd/vercel/production-env
      # #endif
      # #if deployAws
      - name: Read the production environment
        uses: ./.github/workflows/cd/aws/production-env
      # #endif

      - name: Apply Migrations
        run: |
          echo SKIP_ENV_VALIDATION=1 >> .env
          pnpm run db:migrate

  deploy_production:
    name: Deploy Production
    runs-on: ubuntu-24.04-arm
    environment: production
    needs: [code_quality, run_migrations]
    permissions:
      contents: read
      pull-requests: write
      # Required by the OIDC login the AWS deployment target uses; harmless otherwise.
      id-token: write
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Install dependencies & tooling
        uses: ./.github/workflows/setup

      # #if deployVercel
      - name: Deploy to Production
        uses: ./.github/workflows/cd/vercel/deploy-production
      # #endif
      # #if deployAws
      - name: Deploy to Production
        uses: ./.github/workflows/cd/aws/deploy-production
      # #endif
