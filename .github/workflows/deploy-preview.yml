name: Deploy Preview

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  code_quality:
    name: Code quality
    uses: ./.github/workflows/ci.yml

  provision_and_migrate:
    if: ${{ !startsWith(github.head_ref, 'renovate/') }}
    name: Provision & Migrate
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      pull-requests: write
      id-token: write
      issues: write
    outputs:
      current_branch: ${{ steps.branch_name.outputs.current_branch }}
      branch_id: ${{ steps.create_branch.outputs.branch_id }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Install dependencies & tooling
        uses: ./.github/workflows/setup

      - name: Get branch name
        id: branch_name
        uses: tj-actions/branch-names@5250492686b253f06fa55861556d1027b067aeb5 # v9.0.2

      - name: Create Neon Branch
        id: create_branch
        uses: neondatabase/create-branch-action@72ed4f69a12b6be9c16aebfad893f6a21e9aba8b # v6.4.0
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          # parent: main # optional (defaults to your primary branch)
          branch_name: preview/pr-${{ github.event.number }}-${{ steps.branch_name.outputs.current_branch }}
          database: neondb
          role: neondb_owner
          api_key: ${{ secrets.NEON_API_KEY }}

      - name: Mask database connection strings
        run: |
          echo "::add-mask::${{ steps.create_branch.outputs.db_url }}"
          echo "::add-mask::${{ steps.create_branch.outputs.db_url_pooled }}"
          echo "::add-mask::${{ steps.create_branch.outputs.password }}"

      - name: Push database URL to Vercel (scoped to this branch)
        run: |
          echo "${{ steps.create_branch.outputs.db_url_pooled }}" | pnpm dlx vercel env add DATABASE_URL preview "${{ steps.branch_name.outputs.current_branch }}" --force --no-sensitive --token=${{ secrets.VERCEL_TOKEN }}

      - name: Apply Migrations
        run: |
          touch .env
          echo SKIP_ENV_VALIDATION=1 >> .env
          echo DATABASE_URL=${{ steps.create_branch.outputs.db_url_pooled }} >> .env
          pnpm run db:migrate

      - name: Post Schema Diff Comment to PR
        uses: neondatabase/schema-diff-action@80cfa8521628e890015b60f5291a7738926617dc # v1.0.1
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          compare_branch: preview/pr-${{ github.event.number }}-${{ steps.branch_name.outputs.current_branch }}
          database: neondb
          github-token: ${{ secrets.GITHUB_TOKEN }}
          base_branch: main
          api_key: ${{ secrets.NEON_API_KEY }}

  deploy_app:
    if: ${{ !startsWith(github.head_ref, 'renovate/') }}
    name: Deploy Preview
    environment: Preview
    runs-on: ubuntu-24.04-arm
    needs: [provision_and_migrate]
    permissions:
      contents: read
      pull-requests: write
      id-token: write
      issues: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Install dependencies & tooling
        uses: ./.github/workflows/setup

      - name: Deploy to Preview (Vercel)
        id: deploy_vercel
        uses: ./.github/workflows/cd/vercel/deploy-preview
        with:
          VERCEL_TOKEN: ${{ secrets.vercel_token }}
          GIT_BRANCH: ${{ needs.provision_and_migrate.outputs.current_branch }}

      - name: Comment on Pull Request
        uses: thollander/actions-comment-pull-request@24bffb9b452ba05a4f3f77933840a6a841d1b32b # v3.0.1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          message: |
            Vercel Preview URL :rocket: : ${{ steps.deploy_vercel.outputs.preview_url }}
            Neon branch :elephant: : https://console.neon.tech/app/projects/${{ vars.NEON_PROJECT_ID }}/branches/${{ needs.provision_and_migrate.outputs.branch_id }}
