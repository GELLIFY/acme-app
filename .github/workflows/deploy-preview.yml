name: Deploy Preview

# The configuration of the deployment target. Every action under `cd/` reads it from here rather
# than taking it as inputs, which is what keeps the jobs below free of provider-specific wiring:
# only these lines and the `cd/<target>/` paths name a provider.
#
env:
  AWS_REGION: eu-central-1
  # Not the production deploy role: a preview creates a service and a log group from nothing, so it
  # needs a wider one. Provisioned by acme-app-aws's GithubActionsPreviewRole.
  AWS_ROLE: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/gh-actions-preview
  # The environment previews are previews *of*: they reuse its registry, its IAM roles and every
  # secret but the database.
  BASE_ENV: test

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  code_quality:
    name: Code quality
    uses: ./.github/workflows/ci.yml

  provision_and_migrate:
    if: ${{ !startsWith(github.head_ref, 'renovate/') }}
    name: Provision & Migrate
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      pull-requests: write
      id-token: write
      issues: write
    outputs:
      current_branch: ${{ steps.branch_name.outputs.current_branch }}
      branch_id: ${{ steps.create_branch.outputs.branch_id }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Install dependencies & tooling
        uses: ./.github/workflows/setup

      - name: Get branch name
        id: branch_name
        uses: tj-actions/branch-names@5250492686b253f06fa55861556d1027b067aeb5 # v9

      - name: Create Neon Branch
        id: create_branch
        uses: neondatabase/create-branch-action@fb620d43d4c565abaf088b848a4e28e5c4ea4d9c # v6
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          # parent: main # optional (defaults to your primary branch)
          branch_name: preview/pr-${{ github.event.number }}-${{ steps.branch_name.outputs.current_branch }}
          database: neondb
          role: neondb_owner
          api_key: ${{ secrets.NEON_API_KEY }}

      - name: Mask database connection strings
        run: |
          echo "::add-mask::${{ steps.create_branch.outputs.db_url }}"
          echo "::add-mask::${{ steps.create_branch.outputs.db_url_pooled }}"
          echo "::add-mask::${{ steps.create_branch.outputs.password }}"

      # Where the preview's database comes from, and the only step that knows: everything below
      # reads the connection string from this step's output, so its source is chosen in one place.
      #
      - name: Resolve the preview database
        id: database
        env:
          NEON_BRANCH_URL: ${{ steps.create_branch.outputs.db_url_pooled }}
        run: |
          set -euo pipefail
          URL="${NEON_BRANCH_URL:-}"
          if [ -z "$URL" ]; then
            echo "::error::No preview database was provisioned for this pull request." >&2
            exit 1
          fi
          echo "::add-mask::$URL"
          echo "url=$URL" >> "$GITHUB_OUTPUT"
        shell: bash

      - name: Provision the preview environment
        uses: ./.github/workflows/cd/aws/provision-preview
        with:
          PR_NUMBER: ${{ github.event.number }}
          GIT_BRANCH: ${{ steps.branch_name.outputs.current_branch }}
          DATABASE_URL: ${{ steps.database.outputs.url }}

      - name: Apply Migrations
        env:
          DATABASE_URL: ${{ steps.database.outputs.url }}
        run: |
          touch .env
          echo SKIP_ENV_VALIDATION=1 >> .env
          echo "DATABASE_URL=$DATABASE_URL" >> .env
          pnpm run db:migrate

      - name: Post Schema Diff Comment to PR
        uses: neondatabase/schema-diff-action@80cfa8521628e890015b60f5291a7738926617dc # v1
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          compare_branch: preview/pr-${{ github.event.number }}-${{ steps.branch_name.outputs.current_branch }}
          database: neondb
          github-token: ${{ secrets.GITHUB_TOKEN }}
          base_branch: main
          api_key: ${{ secrets.NEON_API_KEY }}

  deploy_app:
    if: ${{ !startsWith(github.head_ref, 'renovate/') }}
    name: Deploy Preview
    environment: Preview
    # Express Mode services run on X86_64 Fargate with no way to configure otherwise, and arm64
    # runners have no binfmt/QEMU registered for cross-arch emulation. Matching the runner to the
    # target architecture avoids emulation entirely instead of fighting it.
    runs-on: ubuntu-24.04
    needs: [provision_and_migrate]
    permissions:
      contents: read
      pull-requests: write
      id-token: write
      issues: write
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Install dependencies & tooling
        uses: ./.github/workflows/setup

      - name: Deploy to Preview
        id: deploy
        uses: ./.github/workflows/cd/aws/deploy-preview
        with:
          PR_NUMBER: ${{ github.event.number }}
          GIT_BRANCH: ${{ needs.provision_and_migrate.outputs.current_branch }}

      # `comment-tag` makes this edit its own comment instead of adding one. The workflow runs on
      # every push to the pull request, and the URL does not change between them: a new comment per
      # push would bury the review conversation under identical links.
      - name: Comment on Pull Request
        uses: thollander/actions-comment-pull-request@24bffb9b452ba05a4f3f77933840a6a841d1b32b # v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          comment-tag: preview-environment
          message: |
            ### Preview environment

            | | |
            |---|---|
            | :rocket: App | ${{ steps.deploy.outputs.preview_url }} |
            | :elephant: Neon branch | https://console.neon.tech/app/projects/${{ vars.NEON_PROJECT_ID }}/branches/${{ needs.provision_and_migrate.outputs.branch_id }} |
            | :package: Service | `ecs-pr-${{ github.event.number }}-eu` |
            | :bookmark: Commit | ${{ github.event.pull_request.head.sha }} |

            Updated on every push. Everything here is torn down when the pull request closes.
