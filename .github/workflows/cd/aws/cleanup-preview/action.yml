name: Cleanup AWS deployment

description: >
  Tears down what the preview created: the ECS Express Mode service, its log group
  and the SSM parameter holding its database connection string.
  Nothing else was ever its own -- the registry, the Express Mode roles
  belong to the base environment and are left alone.

  Each step tolerates an already-absent resource: a closed pull request must not keep a task
  running because one of them had nothing left to delete.

  Configuration comes from the workflow environment (AWS_REGION, AWS_ROLE, BASE_ENV, PROJECT_NAME), not from
  inputs.

inputs:
  PR_NUMBER:
    description: pull request whose preview should be torn down
    required: true
  GIT_BRANCH:
    description: branch the pull request was on; unused here, part of the shared CD contract
    required: false

runs:
  using: composite
  steps:
    - name: Configure AWS credentials (OIDC)
      uses: aws-actions/configure-aws-credentials@f24d7193d98baebaeacc7e2227925dd47cc267f5 # v4.2.0
      with:
        role-to-assume: ${{ env.AWS_ROLE }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Resolve the preview's names
      id: names
      env:
        PR_NUMBER: ${{ inputs.PR_NUMBER }}
      run: |
        set -euo pipefail
        account=$(aws sts get-caller-identity --query Account --output text)

        {
          echo "log_group=/aws/ecs/$PROJECT_NAME-cluster/ecs-$PROJECT_NAME-pr-$PR_NUMBER"
          echo "service_arn=arn:aws:ecs:$AWS_REGION:$account:service/$PROJECT_NAME-cluster/ecs-$PROJECT_NAME-pr-$PR_NUMBER"
          echo "bucket=s3-$PROJECT_NAME-$BASE_ENV-storage-$account"
        } >> "$GITHUB_OUTPUT"
      shell: bash

    # First, because it is the one that costs money while it runs and the one holding a connection
    # to the database branch the cleanup workflow deletes next.
    - name: Delete the service
      continue-on-error: true
      env:
        SERVICE_ARN: ${{ steps.names.outputs.service_arn }}
      run: |
        aws ecs delete-express-gateway-service --service-arn "$SERVICE_ARN"
      shell: bash

    # Deleting the group takes its log streams with it, so there is nothing to sweep up per stream.
    - name: Delete the log group
      continue-on-error: true
      env:
        LOG_GROUP: ${{ steps.names.outputs.log_group }}
      run: |
        aws logs delete-log-group --log-group-name "$LOG_GROUP"
      shell: bash

    - name: Delete the connection string parameter
      continue-on-error: true
      env:
        PR_NUMBER: ${{ inputs.PR_NUMBER }}
      run: |
        aws ssm delete-parameter \
          --name "/$BASE_ENV/pr-$PR_NUMBER/database_url" \
          --region "$AWS_REGION"
      shell: bash

    # Undoes deploy-preview's "Allow the preview's origin" step: drops only this PR's own
    # `pr-<number>` rule from the base environment's bucket, leaving every other rule as it is.
    - name: Remove the preview's CORS rule from the storage bucket
      continue-on-error: true
      env:
        PR_NUMBER: ${{ inputs.PR_NUMBER }}
        BUCKET: ${{ steps.names.outputs.bucket }}
      run: |
        set -euo pipefail
        current=$(aws s3api get-bucket-cors --bucket "$BUCKET" --query 'CORSRules' --output json 2>/dev/null || echo '[]')
        rules=$(echo "$current" | jq -c --arg id "pr-$PR_NUMBER" '(. // []) | map(select(.ID != $id))')
        if [ "$rules" = "[]" ]; then
          aws s3api delete-bucket-cors --bucket "$BUCKET"
        else
          aws s3api put-bucket-cors --bucket "$BUCKET" --cors-configuration "{\"CORSRules\": $rules}"
        fi
      shell: bash
