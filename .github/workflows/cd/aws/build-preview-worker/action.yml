name: Build and Push Worker Image to AWS (preview)

description: >
  Builds the worker image and pushes it to the base environment's registry, tagged with the
  deploying commit's SHA plus `-worker` -- the same tag `deploy-preview-worker` reconstructs to
  find it. Split out of `deploy-preview-worker` so the image builds and pushes in parallel with
  `provision_and_migrate` instead of waiting on it: the build depends on nothing that job produces,
  and a build failure is caught without having provisioned (or migrated) anything for a preview
  that would then need tearing down anyway.

  Configuration comes from the workflow environment (AWS_REGION, AWS_ROLE, BASE_ENV, PROJECT_NAME), not from
  inputs.

runs:
  using: composite
  steps:
    - name: Configure AWS credentials (OIDC)
      uses: aws-actions/configure-aws-credentials@f24d7193d98baebaeacc7e2227925dd47cc267f5 # v4.2.0
      with:
        role-to-assume: ${{ env.AWS_ROLE }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Log in to Amazon ECR
      id: ecr_login
      uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7

    # Same naming as `deploy-preview`'s own "Resolve the preview's names" step -- see its comment
    # for the convention -- but only the one name this job actually touches.
    - name: Resolve the base environment's registry
      id: names
      run: |
        set -euo pipefail
        echo "repository=ecr-$PROJECT_NAME" >> "$GITHUB_OUTPUT"
      shell: bash

    - name: Build and push the worker image
      env:
        REGISTRY: ${{ steps.ecr_login.outputs.registry }}
        REPOSITORY: ${{ steps.names.outputs.repository }}
      run: |
        set -euo pipefail
        tag="$(git rev-parse HEAD)-worker"

        if aws ecr describe-images --repository-name "$REPOSITORY" --image-ids imageTag="$tag" >/dev/null 2>&1; then
          echo "Tag $tag already present in $REPOSITORY, skipping build and push."
        else
          docker build -f Dockerfile.worker -t "$REGISTRY/$REPOSITORY:$tag" .
          docker push "$REGISTRY/$REPOSITORY:$tag"
        fi
      shell: bash
