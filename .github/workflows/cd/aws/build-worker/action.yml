name: Build and Push Worker Image to AWS

description: >
  Builds the worker image and pushes it to the single ECR repository `ecr-acme-app` shared by every base environment (provisioned by acme-app-aws). Images are told apart by tag, `<sha>-<environment>[-worker]`. Split
  out of `deploy-worker` so the image is built and pushed before migrations run -- a build
  failure is caught before anything touches the database, and the push itself never waits on
  `run_migrations`. `deploy-worker` (the task definition redeploy) runs after migrations
  instead and just references the tag this job already pushed.

inputs:
  ENVIRONMENT:
    description: Pulumi stack the resources belong to ("test" or "prod"), the `{environment}` in resourceName()
    required: true
  AWS_ROLE_ARN:
    description: IAM role assumed via OIDC to push the image
    required: true
  IMAGE_TAG:
    description: The deploying commit SHA; the pushed tag is `<sha>-<ENVIRONMENT>[-worker]` (ECR is immutable-tagged)
    required: true

runs:
  using: composite
  steps:
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@f24d7193d98baebaeacc7e2227925dd47cc267f5 # v4.2.0
      with:
        role-to-assume: ${{ inputs.AWS_ROLE_ARN }}
        aws-region: eu-central-1

    - name: Log in to Amazon ECR
      id: ecr_login
      uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7

    - name: Build and push the worker image
      shell: bash
      run: |
        set -euo pipefail

        worker_image="${{ steps.ecr_login.outputs.registry }}/ecr-acme-app:${{ inputs.IMAGE_TAG }}-${{ inputs.ENVIRONMENT }}-worker"

        # The repository is immutable-tagged and the tag is the commit SHA, so re-running this
        # job for a commit already pushed (e.g. retrying a failed deploy step) must not re-push:
        # ECR rejects it, and the existing tag is already the correct image for that commit.
        if aws ecr describe-images --repository-name ecr-acme-app --image-ids imageTag="${{ inputs.IMAGE_TAG }}-${{ inputs.ENVIRONMENT }}-worker" >/dev/null 2>&1; then
          echo "Tag ${{ inputs.IMAGE_TAG }}-${{ inputs.ENVIRONMENT }}-worker already present in ecr-acme-app, skipping build and push."
        else
          docker build -f Dockerfile.worker -t "$worker_image" .
          docker push "$worker_image"
        fi
