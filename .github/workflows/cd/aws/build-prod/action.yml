name: Build and Push Image to AWS (prod)

description: >
  The "prod" entry point for `build`: pins ENVIRONMENT to "prod" so the workflow can't point a prod job
  at another environment's resources. All the logic lives in `build`, shared by every environment.

inputs:
  AWS_ROLE_ARN:
    description: IAM role assumed via OIDC (the "prod" GitHub environment's own AWS_ROLE_ARN)
    required: true
  IMAGE_TAG:
    description: The deploying commit SHA; the image tag is `<sha>-prod[-worker]`
    required: true

runs:
  using: composite
  steps:
    - uses: ./.github/workflows/cd/aws/build
      with:
        ENVIRONMENT: prod
        AWS_ROLE_ARN: ${{ inputs.AWS_ROLE_ARN }}
        IMAGE_TAG: ${{ inputs.IMAGE_TAG }}
