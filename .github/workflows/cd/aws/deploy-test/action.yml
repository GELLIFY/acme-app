name: Deploy Image to AWS (test)

description: >
  The "test" entry point for `deploy`: pins ENVIRONMENT to "test" so the workflow can't point a test job
  at another environment's resources. All the logic lives in `deploy`, shared by every environment.

inputs:
  AWS_ROLE_ARN:
    description: IAM role assumed via OIDC (the "test" GitHub environment's own AWS_ROLE_ARN)
    required: true
  IMAGE_TAG:
    description: The deploying commit SHA; the image tag is `<sha>-test`
    required: true

runs:
  using: composite
  steps:
    - uses: ./.github/workflows/cd/aws/deploy
      with:
        ENVIRONMENT: test
        AWS_ROLE_ARN: ${{ inputs.AWS_ROLE_ARN }}
        IMAGE_TAG: ${{ inputs.IMAGE_TAG }}
