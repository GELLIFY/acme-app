name: CI

on:
  workflow_call:

jobs:
  lint:
    name: "Lint"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Setup Biome
        uses: biomejs/setup-biome@4c91541eaada48f67d7dbd7833600ce162b68f51 # v2.7.1
        with:
          version: "2.5.2"
      - name: Run Biome
        run: biome ci .

  typecheck:
    name: "Typecheck"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Install dependencies & tooling
        uses: ./.github/workflows/setup
      - name: Cache TypeScript build info
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules/.cache/tsbuildinfo.json
          key: tsbuildinfo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            tsbuildinfo-${{ runner.os }}-
      - name: Run Checks
        run: pnpm run typecheck

  test:
    name: "Test"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          fetch-depth: 0 # Shallow clones should be disabled for a better relevancy of analysis
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14 # or "latest", "canary", <sha> #
      - name: Install dependencies & tooling
        uses: ./.github/workflows/setup
      - name: Setup env
        run: |
          cp .env.example .env
          echo SKIP_ENV_VALIDATION=1 >> .env
      - name: Run Tests
        run: pnpm test
