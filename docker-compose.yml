services:
  db:
    image: postgres:17@sha256:7ad98329d513dd497293b951c195ca354274a77f12ddbbbbf85e68a811823d72
    command: "-d 1"
    environment:
      POSTGRES_DB: main
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - type: volume
        source: postgres_data
        target: /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "local"
      options:
        max-size: "20m"
        max-file: "5"

  # #if useWorker
  # The background worker, run locally the same way it runs on ECS (see acme-app-aws's
  # EcsFargateTask invocation contract): `docker compose --profile worker up worker` runs the poll
  # loop, exactly what `ecs:RunTask` starts in production -- it drains whatever is queued, then
  # exits. Not started by default (`docker compose up db` alone, or `pnpm dev`, never brings this
  # up): opt in explicitly when testing the queueing path locally.
  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/main
    depends_on:
      db:
        condition: service_healthy
    profiles:
      - worker
  # #endif

volumes:
  postgres_data:
